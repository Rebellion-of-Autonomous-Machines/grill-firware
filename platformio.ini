[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; upload_port = COM13
; monitor_port = COM13
lib_deps =
  https://github.com/xreef/PCF8574_library.git
  ; janelia-arduino/TMC2209@^10.1.0
  plerup/EspSoftwareSerial@^8.2.0
  https://github.com/emelianov/modbus-esp8266.git
  adafruit/Adafruit MAX31865 library@^1.5.0
